<!DOCTYPE html>
<html lang="ru">
<head>
    <title>Кондитерская</title>
    <style>
        body {
            background-image: url('фон1.jpg');
            color: #D36766;
        }

        .image-container {
            text-align: center; /* Центрируем картинку */
            margin: 35px 0; /* Отступы сверху и снизу */
        }

        .content-wrapper {
            width: 60%; /* Ширина блока с текстом */
            margin: 20px auto; /* Автоматические отступы для центрирования */
            text-align: center; /* Центрирование текста */
        }

        .hero-content {
            font-size: 27px;
            line-height: 1.5; /* Межстрочное расстояние */
        }
    </style>
</head>
<body>
    <header>
        <div class="image-container">
            <img src="logo.png" width="300" height="300" alt="Логотип кондитерской">
        </div>
        
        <div class="content-wrapper">
            <div class="hero-content">
                Добро пожаловать в «Сладкую жизнь» — мир изысканных десертов и ароматных пирожных! 
                Нежные торты, хрустящее печенье и воздушные эклеры ждут вас. 
                Порадуйте себя и близких — каждая сладость здесь создана с любовью.
            </div>
        </div>
    </header>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <title>Кондитерская</title>
    <style>
        body {
            background-image: url('фон5.jpg');
            color: #76201F;
            font-size: 25px;
        }
        header {
               width: 45%; /* Ширина блока с текстом */
               margin: 20px auto; /* Автоматические отступы для центрирования */
               text-align: center; /* Центрирование текста */
               }


        .image-container {
            text-align: center; /* Центрируем картинку */
            margin: 0px 0px; /* Отступы сверху и снизу */
            display: flex;
            gap: 90px; /* расстояние */
        }

        .content-wrapper {
            width: 70%; /* Ширина блока с текстом */
            gap: 210px; /* расстояние */
            text-align: center; /* Центрирование текста */
            display: flex;
        }

        .hero-content {
            font-size: 27px;
            line-height: 1; /* Межстрочное расстояние */
            display: flex;
            margin: 5px 120px; /* Автоматические отступы для центрирования */
            gap: 140px; /* расстояние */
        }
    </style>
</head>
<body>
    <header>
<h1>Наша команда</h1>
<p>Самые талантливые люди каждый день работают над тем, чтобы предоставлять лучший сервис и радовать наших клиентов.</p>
</header>

            <img src="сотрудники.jpg" width="1300" height="500">
